[package]
name = "shardheap-malloc"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "malloc, free and friends over shardheap's ShardAlloc, for LD_PRELOAD"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]
# A test binary of this crate would export `malloc` and replace the test
# harness's own allocator; the C tests in `tests/run.sh` cover it instead.
test = false
doctest = false

[dependencies]
shardheap = { path = ".." }
libc = "0.2"
